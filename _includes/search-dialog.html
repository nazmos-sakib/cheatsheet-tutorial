<dialog class="search-dialog" id="search-dialog" aria-label="Search the site">
  <div class="search-box" data-search>
    <label class="prompt">
      <span class="prompt-sign" aria-hidden="true">$</span>
      <span class="visually-hidden">Search tutorials, cheatsheets and commands</span>
      <input type="search" data-search-input placeholder="search notes and commands" autocomplete="off" spellcheck="false">
      <kbd class="prompt-hint">Esc</kbd>
    </label>
    <ol class="search-results" data-search-results aria-live="polite"></ol>
  </div>
</dialog>
